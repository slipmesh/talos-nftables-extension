# Triggered by a `vX.Y.Z[+nftablesA.B.C]` tag - like ../bird, the release tag *is* the published
# image tag (`+` swapped for `-`; see cliff.toml's tag_pattern and the Makefile's
# RELEASE_TAG_SAFE). `make daemons`/`make extension` need ../talos-extensions checked out as a real
# sibling directory (Makefile: `test -d $(DAEMONS_DIR) || exit 1`), so both repos are checked out
# side by side under `$GITHUB_WORKSPACE` and every step below runs with `working-directory:
# talos-nftables-extension` to make that relative path resolve correctly.
#
# `make extension` chains `nftables-pkg` (pushes the pkgs-stage libmnl/libnftnl/nftables build to
# PKGS_NS=ghcr.io/slipmesh) as a prerequisite before building/pushing the extension image itself -
# one step here covers both stages, matching a local `make extension` run.
#
# EXT_IMAGE already embeds $(TARGET_ARCH) as its own tag suffix (…-amd64 / …-arm64), not a
# combined multi-arch manifest - so this is a plain per-arch matrix, no digest-merge job needed
# (unlike cni-config's release.yml, which does build a single multi-arch manifest).
#
# Each arch runs on its own native runner (ubuntu-24.04-arm for arm64, free for public repos)
# rather than emulating the foreign arch under QEMU on a shared amd64 runner - the bldr/Docker
# build step genuinely compiles nftables/libmnl/libnftnl from source for that step's platform,
# and emulating that costs several times the wall clock. talos-kernel's arm64 leg used to exceed
# GitHub Actions' 6h job limit this way for a full kernel build. No docker/setup-qemu-action
# here: neither job ever builds a foreign platform.
name: Release extension image

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]

permissions:
  contents: read
  packages: write

jobs:
  release:
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
        include:
          - arch: amd64
            rust_target: x86_64-unknown-linux-musl
            runner: ubuntu-24.04
          - arch: arm64
            rust_target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
        with:
          path: talos-nftables-extension

      - name: Read DAEMONS_REF
        id: pins
        working-directory: talos-nftables-extension
        run: echo "daemons_ref=$(sed -n 's/^DAEMONS_REF=//p' versions.env)" >> "$GITHUB_OUTPUT"

      # fetch-depth: 0 so `make check-daemons` can resolve the tag with `git describe`; a
      # shallow checkout carries the commit but not the tag that names it.
      - uses: actions/checkout@v4
        with:
          repository: slipmesh/talos-extensions
          ref: ${{ steps.pins.outputs.daemons_ref }}
          fetch-depth: 0
          path: talos-extensions

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: talos-extensions
          key: ${{ matrix.rust_target }}

      - uses: mlugg/setup-zig@v2

      - name: Install cargo-zigbuild
        run: cargo install cargo-zigbuild --locked

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push nftables-pkg + extension image
        working-directory: talos-nftables-extension
        run: make extension TARGET_ARCH=${{ matrix.arch }} RELEASE_TAG=${{ github.ref_name }}
